spring.application.name=product
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/products}
spring.datasource.username=${DB_USERNAME:products}
spring.datasource.password=${DB_PASSWORD:products}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.forward-headers-strategy=framework
app.security.require-https=${REQUIRE_HTTPS:true}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-32-byte-value}
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

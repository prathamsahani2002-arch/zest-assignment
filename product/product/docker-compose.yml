services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    ports:
      - "5432:5432"
    volumes:
      - product-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/products
      DB_USERNAME: products
      DB_PASSWORD: products
      JWT_SECRET: change-this-in-production-to-a-long-random-secret
      REQUIRE_HTTPS: "false"
    ports:
      - "8080:8080"
volumes:
  product-db: